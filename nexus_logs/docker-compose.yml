services:
  web:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data      # SQLite database — survives rebuilds
      - ./media:/app/media    # any uploaded files
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-.env}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_TIME_ZONE: "Africa/Johannesburg"
    restart: unless-stopped
